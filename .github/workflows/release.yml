name: Build and Publish Release

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (use \n for line breaks)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from module.prop
        id: get_version
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2 | tr -d '"' | tr -d "'" | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Package project into ZIP
        run: |
          ZIP_NAME="WhenAppStart-${{ steps.get_version.outputs.version }}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          zip -r "$ZIP_NAME" . -x ".github/*" -x ".git*"

      - name: Process release notes
        id: process_notes
        env:
          RAW_NOTES: ${{ inputs.release_notes }}
        run: |
          PROCESSED_NOTES=$(echo "$RAW_NOTES" | sed 's/\\n/\n/g')
          {
            echo "body<<EOF"
            echo "$PROCESSED_NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body: ${{ steps.process_notes.outputs.body }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
